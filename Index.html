<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Toddler Mail">
  <link rel="manifest" href="./manifest.json">
  <title>Toddler Mail</title>
  <style>
    /* 1. Global Touch Controls */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      width: 100%;
      height: 100%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* 2. Email Compose Window */
    .email-container {
      background: #ffffff;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
      flex-shrink: 0;
      z-index: 20;
      position: relative;
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
      gap: 10px;
      position: relative;
    }

    /* Recipient Selector */
    .recipient-wrapper {
      display: flex;
      align-items: center;
      position: relative;
    }

    .recipient-button {
      font-size: 22px;
      font-weight: 800;
      color: #1d4ed8;
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 8px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recipient-button:active {
      background: #dbeafe;
    }

    /* Popover Menu */
    .recipient-menu {
      display: none;
      position: absolute;
      top: 52px;
      left: 0;
      background: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      padding: 6px;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      min-width: 240px;
    }

    .recipient-menu.open {
      display: flex;
    }

    .recipient-option {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .recipient-option:active {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    /* Send Button */
    .send-btn {
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 10px 24px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      touch-action: none;
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.95);
      background: #16a34a;
    }

    /* Typing Area */
    .email-content {
      min-height: 80px;
      max-height: 110px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 600;
      color: #1e293b;
      padding-top: 10px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .placeholder {
      color: #94a3b8;
    }

    /* Unlock Voice Banner */
    .voice-unlock-container {
      text-align: center;
      margin: 4px 0;
      z-index: 50;
    }

    .voice-unlock-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 28px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: pulseBtn 1.5s infinite;
    }
