<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Toddler Mail">
  <link rel="manifest" href="./manifest.json">
  <title>Toddler Mail</title>
  <style>
    /* Global Reset & Touch Control */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      width: 100%;
      height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Email Card Window */
    .email-container {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
      flex-shrink: 0;
      z-index: 10;
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      gap: 10px;
    }

    .recipient-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .to-label {
      font-size: 22px;
      font-weight: 700;
      color: #64748b;
    }

    /* Recipient Dropdown */
    .recipient-select {
      font-size: 20px;
      font-weight: bold;
      color: #2563eb;
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* X / Clear Button */
    .clear-btn {
      background: #fee2e2;
      color: #ef4444;
      border: 2px solid #fca5a5;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(239, 68, 68, 0.2);
    }

    .clear-btn:active {
      transform: scale(0.92);
      background: #fecaca;
    }

    /* Bright Send Button */
    .send-btn {
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 10px 22px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      touch-action: none;
    }

    .send-btn:active {
      transform: scale(0.95);
      background: #16a34a;
    }

    /* Typing Display Area */
    .email-content {
      min-height: 100px;
      max-height: 130px;
      font-size: 30px;
      font-weight: 600;
      color: #1e293b;
      padding-top: 14px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    .placeholder {
      color: #94a3b8;
    }

    /* Flying Envelope State */
    .flying {
      transform: translate(600px, -800px) scale(0.1) rotate(20deg);
      opacity: 0;
    }

    /* Keyboard Container */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 6px;
      touch-action: none;
      z-index: 10;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-bottom: 4px solid #94a3b8;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #1e293b;
      height: 58px;
      flex: 1;
      max-width: 66px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .key:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
      background: #f1f5f9;
    }

    .key.backspace {
      max-width: 86px;
      background: #fee2e2;
      border-color: #fca5a5;
      border-bottom-color: #f87171;
      color: #dc2626;
    }

    .key.space {
      max-width: 380px;
      font-size: 18px;
      letter-spacing: 2px;
      color: #64748b;
    }

    /* Confetti Particle Styles */
    .confetti-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    .confetti-piece {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      animation: confettiFall 1.2s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) rotateY(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(700px) rotateX(720deg) rotateY(360deg) scale(0.5);
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Confetti Layer -->
    <div class="confetti-layer" id="confettiLayer"></div>

    <!-- Email Compose Card -->
    <div class="email-container" id="emailCard">
      <div class="email-header">
        <div class="recipient-wrapper">
          <span class="to-label">To:</span>
          <!-- Recipient Dropdown List -->
          <select class="recipient-select" id="recipientSelect">
            <option value="Gaga">Gaga 👨</option>
            <option value="Mama">Mama 👩</option>
            <option value="Grandma">Grandma 👵</option>
            <option value="Grandpa">Grandpa 👴</option>
            <option value="Uncle Dado">Uncle Dado 🧔</option>
          </select>
        </div>

        <div class="header-actions">
          <!-- X / Clear Button -->
          <button class="clear-btn" id="clearBtn" type="button" title="Clear">✖</button>
          <!-- Send Button -->
          <button class="send-btn" id="sendBtn" type="button">SEND 🚀</button>
        </div>
      </div>

      <div class="email-content" id="emailContent">
        <span class="placeholder">Tap keys to write...</span>
      </div>
    </div>

    <!-- Keyboard -->
    <div class="keyboard" id="keyboard">
      <!-- Row 1 -->
      <div class="kb-row">
        <button type="button" class="key" data-k="Q">Q</button>
        <button type="button" class="key" data-k="W">W</button>
        <button type="button" class="key" data-k="E">E</button>
        <button type="button" class="key" data-k="R">R</button>
        <button type="button" class="key" data-k="T">T</button>
        <button type="button" class="key" data-k="Y">Y</button>
        <button type="button" class="key" data-k="U">U</button>
        <button type="button" class="key" data-k="I">I</button>
        <button type="button" class="key" data-k="O">O</button>
        <button type="button" class="key" data-k="P">P</button>
      </div>
      <!-- Row 2 -->
      <div class="kb-row">
        <button type="button" class="key" data-k="A">A</button>
        <button type="button" class="key" data-k="S">S</button>
        <button type="button" class="key" data-k="D">D</button>
        <button type="button" class="key" data-k="F">F</button>
        <button type="button" class="key" data-k="G">G</button>
        <button type="button" class="key" data-k="H">H</button>
        <button type="button" class="key" data-k="J">J</button>
        <button type="button" class="key" data-k="K">K</button>
        <button type="button" class="key" data-k="L">L</button>
      </div>
      <!-- Row 3 -->
      <div class="kb-row">
        <button type="button" class="key" data-k="Z">Z</button>
        <button type="button" class="key" data-k="X">X</button>
        <button type="button" class="key" data-k="C">C</button>
        <button type="button" class="key" data-k="V">V</button>
        <button type="button" class="key" data-k="B">B</button>
        <button type="button" class="key" data-k="N">N</button>
        <button type="button" class="key" data-k="M">M</button>
        <button type="button" class="key backspace" data-k="BACKSPACE">⌫</button>
      </div>
      <!-- Row 4 -->
      <div class="kb-row">
        <button type="button" class="key space" data-k=" ">SPACE</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('Service Worker Active:', reg.scope);
          })
          .catch(function(err) {
            console.warn('SW registration issue:', err);
          });
      });
    }

    var currentText = "";
    var isSending = false;
    var audioCtx = null;
    var recipientSelect = document.getElementById('recipientSelect');
    var emailContent = document.getElementById('emailContent');
    var emailCard = document.getElementById('emailCard');

    // --- 2. Reliable Audio & Voice Engine ---
    function unlockAudioSystem() {
      try {
        if (!audioCtx) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function speakVoice(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.9;
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);
        }
      } catch (err) {}
    }

    // Announce selected recipient on dropdown change
    recipientSelect.addEventListener('change', function() {
      unlockAudioSystem();
      speakVoice("To " + recipientSelect.value);
    });

    // --- 3. Synthesized Sound Effects ---
    function playTone(type) {
      unlockAudioSystem();
      if (!audioCtx) return;
      try {
        if (type === 'tap') {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'clear') {
          var osc2 = audioCtx.createOscillator();
          var gain2 = audioCtx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
          gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain2.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'whoosh') {
          var bufferSize = audioCtx.sampleRate * 0.5;
          var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          var noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          var filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(250, audioCtx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.25);
          filter.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.5);
          var gainWhoosh = audioCtx.createGain();
          gainWhoosh.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gainWhoosh.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.15);
          gainWhoosh.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          noise.connect(filter);
          filter.connect(gainWhoosh);
          gainWhoosh.connect(audioCtx.destination);
          noise.start();
          noise.stop(audioCtx.currentTime + 0.5);
        }
      } catch (err) {}
    }

    // --- 4. Confetti Animation ---
    function triggerConfetti() {
      var container = document.getElementById('confettiLayer');
      var colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
      for (var i = 0; i < 45; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = (Math.random() * 95) + '%';
        piece.style.top = (Math.random() * 20 + 5) + '%';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        var size = (Math.random() * 8 + 10) + 'px';
        piece.style.width = size;
        piece.style.height = size;
        if (Math.random() > 0.5) piece.style.borderRadius = '50%';
        piece.style.animationDelay = (Math.random() * 0.25) + 's';
        piece.style.animationDuration = (Math.random() * 0.5 + 0.9) + 's';
        container.appendChild(piece);
      }
      setTimeout(function() {
        container.innerHTML = '';
      }, 1500);
    }

    // --- 5. Screen Actions ---
    function updateDisplay() {
      if (currentText.length === 0) {
        emailContent.innerHTML = '<span class="placeholder">Tap keys to write...</span>';
      } else {
        emailContent.textContent = currentText;
      }
      emailContent.scrollTop = emailContent.scrollHeight;
    }

    function handleKey(val) {
      if (isSending) return;
      playTone('tap');
      if (val === 'BACKSPACE') {
        currentText = currentText.slice(0, -1);
      } else {
        currentText += val;
      }
      updateDisplay();
    }

    function clearEmail() {
      if (isSending) return;
      playTone('clear');
      currentText = "";
      updateDisplay();
    }

    function sendEmail() {
      if (isSending) return;
      isSending = true;

      var recipientName = recipientSelect.value;

      playTone('whoosh');
      triggerConfetti();
      emailCard.classList.add('flying');

      setTimeout(function() {
        speakVoice("Email sent to " + recipientName + "!");
      }, 200);

      setTimeout(function() {
        currentText = "";
        updateDisplay();
        emailCard.style.transition = 'none';
        emailCard.classList.remove('flying');

        setTimeout(function() {
          emailCard.style.transition = '';
          isSending = false;
        }, 50);
      }, 850);
    }

    // --- 6. Gesture & Touch Binding ---
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    }, { passive: false });

    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') {
        return;
      }
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    function bindAction(element, callback) {
      var touchHandled = false;
      element.addEventListener('touchstart', function(e) {
        e.preventDefault();
        touchHandled = true;
        callback();
      }, { passive: false });
      element.addEventListener('click', function(e) {
        if (!touchHandled) {
          callback();
        }
        touchHandled = false;
      });
    }

    // Bind Keys
    var keys = document.querySelectorAll('.key');
    for (var i = 0; i < keys.length; i++) {
      (function(btn) {
        var keyVal = btn.getAttribute('data-k');
        bindAction(btn, function() {
          handleKey(keyVal);
        });
      })(keys[i]);
    }

    // Bind Send & Clear Buttons
    bindAction(document.getElementById('sendBtn'), sendEmail);
    bindAction(document.getElementById('clearBtn'), clearEmail);
  </script>
</body>
</html>
